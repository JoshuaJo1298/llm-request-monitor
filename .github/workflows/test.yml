name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://monitor:monitor@localhost:5432/monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - name: Capture incident demo
        env:
          DATABASE_URL: postgresql://monitor:monitor@localhost:5432/monitor
        run: |
          python -m uvicorn app:app &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/metrics; then break; fi
            sleep 1
          done
          python seed.py > /tmp/incident.jsonl
          curl -fsS --data-binary @/tmp/incident.jsonl http://127.0.0.1:8000/api/import
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1100,650 --screenshot=dashboard.png http://127.0.0.1:8000/
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-demo
          path: dashboard.png
